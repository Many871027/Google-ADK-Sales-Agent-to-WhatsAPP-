agents:
  request_agent:
    type: instance
    models: [gemini-2.5-flash-lite]
    tools: [buscar_producto_wrapper, agregar_al_carrito_wrapper, ver_carrito_wrapper, remover_del_carrito_wrapper, modificar_cantidad_wrapper]
    params:
      name: agent_for_{business.id}
      instruction: final_instruction
      before_agent_callback: before_agent_prod
      after_agent_callback: after_agent_prod
      before_model_callback: before_model_prod
      after_model_callback: after_model_prod
      before_tool_callback: before_tool_prod
      after_tool_callback: after_tool_prod
      function: process_customer_message
  root_agent:
    type: instance
    models: [gemini-2.5-flash-lite]
    tools: [buscar_producto, agregar_al_carrito, ver_carrito]
    params:
      name: sales_agent_template
      description: Agente de ventas base para la plataforma WHSP-AI.
      instruction: [Eres un asistente de ventas conversacional.]

models:
  gemini-2.5-flash-lite:
    type: literal
    agents: [root_agent, request_agent]

tools:
  agregar_al_carrito:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Agrega una cantidad específica de un producto al carrito de compras
        (orden pendiente) del cliente para un negocio específico.
  agregar_al_carrito_wrapper:
    type: function
    agents: [request_agent]
    params:
      description: |-
        Wrapper simple para agregar un producto al carrito.
        Args:
            nombre_producto: Nombre del producto a agregar.
            cantidad: Cantidad a agregar (puede ser float).
        Returns:
            Diccionario con el resultado de la operación.
  buscar_producto:
    type: function
    agents: [root_agent]
    params:
      description: Busca un producto en la base de datos combinando búsqueda exacta y flexible.
  buscar_producto_wrapper:
    type: function
    agents: [request_agent]
    params:
      description: |-
        Busca un producto y maneja el caso 'unconfirmed' para Human-in-the-Loop.
        Args:
            nombre_producto: El nombre o descripción parcial del producto.
        Returns:
            Diccionario con el resultado de la búsqueda.
  modificar_cantidad_wrapper:
    type: function
    agents: [request_agent]
    params:
      description: |-
        Wrapper simple para modificar la cantidad de un producto en el carrito.
        Args:
            nombre_producto: Nombre del producto a modificar.
            nueva_cantidad: La nueva cantidad deseada (puede ser 0 para eliminar).
        Returns:
            Diccionario con el resultado de la operación.
  remover_del_carrito_wrapper:
    type: function
    agents: [request_agent]
    params:
      description: |-
        Wrapper simple para eliminar un producto del carrito.
        Args:
            nombre_producto: Nombre del producto a eliminar.
        Returns:
            Diccionario con el resultado de la operación.
  ver_carrito:
    type: function
    agents: [root_agent]
    params:
      description: Muestra el contenido actual del carrito de compras (orden pendiente) del cliente.
  ver_carrito_wrapper:
    type: function
    agents: [request_agent]
    params:
      description: |-
        Wrapper simple para mostrar el contenido del carrito.
        Returns:
            Diccionario con el contenido del carrito o estado vacío/error.

